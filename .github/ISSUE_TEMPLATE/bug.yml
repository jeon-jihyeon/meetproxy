name: Bug report
description: Something meetproxy did wrong or failed to do
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For a security problem use private reporting from the Security tab instead.
        Leave out tokens, message text and links you would not post publicly.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what meetproxy did, and what you expected instead
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Select one owned neutral window or synthetic source event
        2. Call the Go API or a control or listen command
        3. Compare the result with the expected state
  - type: input
    id: environment
    attributes:
      label: Caller and driver versions
      description: Go version or host name and version, plus the configured driver's version
      placeholder: Go 1.26.10 and Cua Driver 0.37.0
    validations:
      required: true
  - type: input
    id: plugin
    attributes:
      label: meetproxy version
      description: Output of `meetproxy version`, or the imported module version
      placeholder: dev
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - macOS arm64
        - macOS amd64
        - Linux amd64
        - Linux arm64
        - Other
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Result or receipt
      description: Optional redacted state, recorded flag and error category. Do not include tokens, real message bodies, window contents or private paths
      render: text
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Anything else
      description: A redacted error category or neutral reproduction, without private application data
      render: text
