name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      macos:
        description: Also run the Go tests on macOS
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ inputs.macos && fromJSON('["ubuntu-latest","macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check formatting
        if: runner.os == 'Linux'
        shell: python
        run: |
          import subprocess
          import sys
          output = subprocess.check_output(["gofmt", "-l", "."], text=True)
          print(output, end="")
          sys.exit(bool(output.strip()))
      - name: Build
        run: go build ./...
      - name: Vet
        if: runner.os == 'Linux'
        run: go vet ./...
      - name: Test release verifier
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s .github/scripts -p 'test_verify_release.py'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        if: runner.os == 'Linux'
        with:
          version: v2.11.4
      - name: Test with race detector
        run: go test -race -count=1 ./...

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.290
      - name: Validate the plugin
        run: claude plugin validate plugin
      - name: Validate the marketplace
        run: claude plugin validate .
