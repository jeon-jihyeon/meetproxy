name: release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
      - name: Check clean tagged source
        run: python3 .github/scripts/verify_release.py source --tag "$GITHUB_REF_NAME" --source-digest "$GITHUB_SHA"
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "v2.19.0"
          args: release --clean --skip=publish,announce --release-notes CHANGELOG.md
        env:
          GOTOOLCHAIN: go1.26.10
      - name: Check release artifacts
        run: python3 .github/scripts/verify_release.py artifacts --tag "$GITHUB_REF_NAME" --source-digest "$GITHUB_SHA"
