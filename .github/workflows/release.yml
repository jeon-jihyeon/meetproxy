name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check clean tagged source
        run: python3 .github/scripts/verify_release.py source --tag "$GITHUB_REF_NAME" --source-digest "$GITHUB_SHA"
      - name: Extract tagged release notes
        run: python3 .github/scripts/verify_release.py notes --tag "$GITHUB_REF_NAME" --output "$RUNNER_TEMP/release-notes.md"
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.19.0
          args: release --clean --skip=publish,announce --release-notes ${{ runner.temp }}/release-notes.md
        env:
          GOTOOLCHAIN: go1.26.10
      - name: Check local archives
        run: python3 .github/scripts/verify_release.py artifacts --tag "$GITHUB_REF_NAME" --source-digest "$GITHUB_SHA"
      - name: Prepare release bundle
        shell: python
        run: |
          import os
          from pathlib import Path
          import shutil
          import sys
          sys.path.insert(0, ".github/scripts")
          from verify_release import SUBJECTS
          bundle = Path(os.environ["RUNNER_TEMP"]) / "release-bundle"
          bundle.mkdir()
          for name in SUBJECTS:
              shutil.copyfile(Path("dist") / name, bundle / name)
          shutil.copyfile(bundle.parent / "release-notes.md", bundle / "release-notes.md")
          verifier = bundle / "verification" / "scripts" / "verify_release.py"
          verifier.parent.mkdir(parents=True)
          shutil.copyfile(Path(".github/scripts/verify_release.py"), verifier)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle
          path: ${{ runner.temp }}/release-bundle
          if-no-files-found: error
          retention-days: 1

  upload:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: release-bundle
      - name: Upload draft release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release-bundle/meetproxy_darwin_amd64.tar.gz \
            release-bundle/meetproxy_darwin_arm64.tar.gz \
            release-bundle/meetproxy_linux_amd64.tar.gz \
            release-bundle/meetproxy_linux_arm64.tar.gz \
            release-bundle/checksums.txt \
            --repo "github.com/$GITHUB_REPOSITORY" \
            --draft --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file release-bundle/release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_HOST: github.com

      - name: Check uploaded bytes
        run: |
          python3 release-bundle/verification/scripts/verify_release.py uploaded-bytes \
            --tag "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --dist release-bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_HOST: github.com
