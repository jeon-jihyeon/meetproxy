version: 2

builds:
  - main: ./cmd/meetproxy
    binary: meetproxy
    env:
      - CGO_ENABLED=0
      - GOTOOLCHAIN=go1.26.10
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: "meetproxy_{{ .Os }}_{{ .Arch }}"
    builds_info:
      owner: root
      group: root
      mode: 0755
      mtime: "{{ .CommitDate }}"
    files:
      - src: LICENSE
        info: &notice_info
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: NOTICE
        info: *notice_info

checksum:
  name_template: checksums.txt

changelog:
  disable: true

# Unpublished until the uploaded bytes match the checked local artifacts
release:
  draft: true
