version: "2"
linters:
  enable:
    - depguard
    - dupl
    - funlen
    - gocritic
    - gocyclo
    - nakedret
    - revive
    - unparam
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    funlen:
      lines: 70
      statements: 50
    dupl:
      threshold: 120
    gocyclo:
      min-complexity: 15
    revive:
      rules:
        - name: comment-spacings
          disabled: true
        - name: exported
          disabled: true
    # Imports point down only
    # 1. cmd uses everything and nothing imports cmd
    # 4. fileio and shell use no package of the module
    # 5. slackapi speaks HTTP alone and only cmd uses it
    # 6. github runs gh, uses only dest and only cmd uses it
    depguard:
      rules:
        github:
          files:
            - "**/internal/github/**"
            - "!$test"
          deny:
            - pkg: github.com/jeon-jihyeon/meetproxy/internal/fileio
              desc: github uses only dest
            - pkg: github.com/jeon-jihyeon/meetproxy/internal/slackapi
              desc: github uses only dest
            - pkg: github.com/jeon-jihyeon/meetproxy/cmd
              desc: nothing imports cmd
        base:
          files:
            - "**/internal/fileio/**"
            - "**/internal/shell/**"
            - "**/internal/slackapi/**"
            - "!$test"
          deny:
            - pkg: github.com/jeon-jihyeon/meetproxy
              desc: fileio, shell, slackapi use no package of the module
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - dupl
          - funlen
          - gocyclo
          - unparam
