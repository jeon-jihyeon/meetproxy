version: "2"
linters:
  enable:
    - depguard
    - dupl
    - funlen
    - gocritic
    - gocyclo
    - nakedret
    - revive
    - unparam
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    funlen:
      lines: 70
      statements: 50
    dupl:
      threshold: 120
    gocyclo:
      min-complexity: 15
    revive:
      rules:
        - name: comment-spacings
          disabled: true
        - name: exported
          disabled: true
    # Imports point down only
    # 1. cmd uses everything and nothing imports cmd
    # 2. guard uses only dest and shell
    # 3. relay and workmap know nothing of posting
    # 4. any package may use fileio and shell which use no package of the module
    # 5. slackapi speaks HTTP alone and only cmd uses it
    # 6. github runs gh, uses only dest and only cmd uses it
    depguard:
      rules:
        github:
          files:
            - "**/internal/github/**"
            - "!$test"
          deny:
            - pkg: github.com/jeon-jihyeon/meetproxy/internal/relay
              desc: github uses only dest
            - pkg: github.com/jeon-jihyeon/meetproxy/internal/guard
              desc: github uses only dest
            - pkg: github.com/jeon-jihyeon/meetproxy/internal/inbox
              desc: github uses only dest
            - pkg: github.com/jeon-jihyeon/meetproxy/internal/posts
              desc: github uses only dest
            - pkg: github.com/jeon-jihyeon/meetproxy/internal/fileio
              desc: github uses only dest
            - pkg: github.com/jeon-jihyeon/meetproxy/internal/slackapi
              desc: github uses only dest
            - pkg: github.com/jeon-jihyeon/meetproxy/cmd
              desc: nothing imports cmd
        base:
          files:
            - "**/internal/fileio/**"
            - "**/internal/shell/**"
            - "**/internal/slackapi/**"
            - "!$test"
          deny:
            - pkg: github.com/jeon-jihyeon/meetproxy
              desc: fileio, shell and slackapi use no package of the module
        leaf:
          files:
            - "**/internal/dest/**"
            - "**/internal/inbox/**"
            - "**/internal/triage/**"
            - "**/internal/delegation/**"
            - "**/internal/posts/**"
          deny:
            - pkg: github.com/jeon-jihyeon/meetproxy/internal/relay
              desc: leaf packages do not import relay
            - pkg: github.com/jeon-jihyeon/meetproxy/internal/guard
              desc: leaf packages do not import guard
            - pkg: github.com/jeon-jihyeon/meetproxy/internal/workmap
              desc: leaf packages do not import workmap
            - pkg: github.com/jeon-jihyeon/meetproxy/internal/slackapi
              desc: only cmd calls Slack
            - pkg: github.com/jeon-jihyeon/meetproxy/internal/github
              desc: only cmd calls GitHub
            - pkg: github.com/jeon-jihyeon/meetproxy/cmd
              desc: nothing imports cmd
        workmap:
          files:
            - "**/internal/workmap/**"
          deny:
            - pkg: github.com/jeon-jihyeon/meetproxy/internal/relay
              desc: workmap does not import relay
            - pkg: github.com/jeon-jihyeon/meetproxy/internal/guard
              desc: workmap does not import guard
            - pkg: github.com/jeon-jihyeon/meetproxy/internal/dest
              desc: workmap does not know about posting
            - pkg: github.com/jeon-jihyeon/meetproxy/internal/slackapi
              desc: only cmd calls Slack
            - pkg: github.com/jeon-jihyeon/meetproxy/cmd
              desc: nothing imports cmd
        guard:
          files:
            - "**/internal/guard/**"
          deny:
            - pkg: github.com/jeon-jihyeon/meetproxy/internal/relay
              desc: guard decides from the locations it is given
            - pkg: github.com/jeon-jihyeon/meetproxy/internal/inbox
              desc: guard uses only dest and shell
            - pkg: github.com/jeon-jihyeon/meetproxy/internal/triage
              desc: guard uses only dest and shell
            - pkg: github.com/jeon-jihyeon/meetproxy/internal/delegation
              desc: guard uses only dest and shell
            - pkg: github.com/jeon-jihyeon/meetproxy/internal/workmap
              desc: guard uses only dest and shell
            - pkg: github.com/jeon-jihyeon/meetproxy/internal/fileio
              desc: guard uses only dest and shell
            - pkg: github.com/jeon-jihyeon/meetproxy/internal/slackapi
              desc: guard uses only dest and shell
            - pkg: github.com/jeon-jihyeon/meetproxy/cmd
              desc: nothing imports cmd
        relay:
          files:
            - "**/internal/relay/**"
          deny:
            - pkg: github.com/jeon-jihyeon/meetproxy/internal/dest
              desc: relay does not know about posting
            - pkg: github.com/jeon-jihyeon/meetproxy/internal/guard
              desc: relay does not know about posting
            - pkg: github.com/jeon-jihyeon/meetproxy/internal/slackapi
              desc: only cmd calls Slack
            - pkg: github.com/jeon-jihyeon/meetproxy/cmd
              desc: nothing imports cmd
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - dupl
          - funlen
          - gocyclo
          - unparam
