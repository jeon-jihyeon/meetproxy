version: "2"
linters:
  enable:
    - depguard
    - dupl
    - forbidigo
    - funlen
    - gocritic
    - gocyclo
    - nakedret
    - revive
    - unparam
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    funlen:
      lines: 70
      statements: 50
    dupl:
      threshold: 120
    gocyclo:
      min-complexity: 15
    revive:
      rules:
        - name: comment-spacings
          disabled: true
        - name: exported
          disabled: true
    # Migrated entry points depend only on the public application layer
    # Pure models and host values use only the standard library
    # Stores use fileio and never import a domain model
    # Unmoved packages keep their existing strict rules
    # Tests are outside the import rules
    depguard:
      rules:
        migrated-entry:
          list-mode: strict
          files:
            - "**/cmd/meetproxy/slack_account.go"
            - "**/cmd/meetproxy/signin.go"
            - "!$test"
          allow:
            - $gostd
            - github.com/jeon-jihyeon/meetproxy/app/
        application:
          list-mode: strict
          files:
            - "**/app/**"
            - "!$test"
          allow:
            - $gostd
            - github.com/jeon-jihyeon/meetproxy/internal/
            - github.com/jeon-jihyeon/meetproxy/app/host$
        pure-values:
          list-mode: strict
          files:
            - "**/internal/slackstate/**"
            - "**/internal/signin/**"
            - "**/app/host/**"
            - "!$test"
          allow:
            - $gostd
        storage:
          list-mode: strict
          files:
            - "**/internal/store/**"
            - "!$test"
          allow:
            - $gostd
            - github.com/jeon-jihyeon/meetproxy/internal/fileio$
        base:
          list-mode: strict
          files:
            - "**/internal/fileio/**"
            - "**/internal/shell/**"
            - "**/internal/slackapi/**"
            - "**/internal/slackmcp/**"
            - "**/internal/signinbrowser/**"
            - "**/internal/osdialog/**"
            - "!$test"
          allow:
            - $gostd
        github:
          list-mode: strict
          files:
            - "**/internal/github/**"
            - "!$test"
          allow:
            - $gostd
            - github.com/jeon-jihyeon/meetproxy/internal/messageurl$
    # Only cmd reads the process environment
    forbidigo:
      forbid:
        - pattern: ^os\.(Getenv|LookupEnv|Environ|ExpandEnv)$
          msg: only cmd reads the process environment
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - dupl
          - funlen
          - gocyclo
          - unparam
      - path: (_test\.go|^cmd/)
        linters:
          - forbidigo
