version: "2"
linters:
  enable:
    - depguard
    - dupl
    - funlen
    - gocritic
    - gocyclo
    - nakedret
    - revive
    - unparam
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    funlen:
      lines: 70
      statements: 50
    dupl:
      threshold: 120
    gocyclo:
      min-complexity: 15
    revive:
      rules:
        - name: comment-spacings
          disabled: true
        - name: exported
          disabled: true
    # Imports point down only
    # 1. cmd uses everything and nothing imports cmd
    # 4. any package may use fileio and shell which use no package of the module
    depguard:
      rules:
        base:
          files:
            - "**/internal/fileio/**"
            - "**/internal/shell/**"
            - "!$test"
          deny:
            - pkg: github.com/jeon-jihyeon/meetproxy
              desc: fileio and shell use no package of the module
        leaf:
          files:
            - "**/internal/locmap/**"
          deny:
            - pkg: github.com/jeon-jihyeon/meetproxy/cmd
              desc: nothing imports cmd
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - dupl
          - funlen
          - gocyclo
          - unparam
