version: "2"
linters:
  enable:
    - depguard
    - dupl
    - forbidigo
    - funlen
    - gocritic
    - gocyclo
    - nakedret
    - revive
    - unparam
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    funlen:
      lines: 70
      statements: 50
    dupl:
      threshold: 120
    gocyclo:
      min-complexity: 15
    revive:
      rules:
        - name: comment-spacings
          disabled: true
        - name: exported
          disabled: true
    # Imports point down only and each rule allows exactly what its package may use
    # 1. cmd uses everything and nothing imports cmd
    # 2. fileio, shell, slackapi, slackmcp use no package of the module
    # 5. Tests are left out of every rule
    depguard:
      rules:
        base:
          list-mode: strict
          files:
            - "**/internal/fileio/**"
            - "**/internal/shell/**"
            - "**/internal/slackapi/**"
            - "**/internal/slackmcp/**"
            - "!$test"
          allow:
            - $gostd
        github:
          list-mode: strict
          files:
            - "**/internal/github/**"
            - "!$test"
          allow:
            - $gostd
            - github.com/jeon-jihyeon/meetproxy/internal/messageurl$
    # Only cmd reads the process environment
    forbidigo:
      forbid:
        - pattern: ^os\.(Getenv|LookupEnv|Environ|ExpandEnv)$
          msg: only cmd reads the process environment
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - dupl
          - funlen
          - gocyclo
          - unparam
      - path: (_test\.go|^cmd/)
        linters:
          - forbidigo
