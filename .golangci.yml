version: "2"
linters:
  enable:
    - depguard
    - dupl
    - forbidigo
    - funlen
    - gocritic
    - gocyclo
    - nakedret
    - revive
    - unparam
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    funlen:
      lines: 70
      statements: 50
    dupl:
      threshold: 120
    gocyclo:
      min-complexity: 15
    revive:
      rules:
        - name: comment-spacings
          disabled: true
        - name: exported
          disabled: true
    depguard:
      rules:
        entry:
          list-mode: strict
          files: ["**/cmd/**", "!$test"]
          allow:
            - $gostd
            - github.com/jeon-jihyeon/meetproxy/app/
        application:
          list-mode: strict
          files: ["**/app/**", "!$test"]
          allow:
            - $gostd
            - github.com/jeon-jihyeon/meetproxy/internal/
        infrastructure:
          list-mode: strict
          files: ["**/internal/**", "!$test"]
          allow:
            - $gostd
        model:
          list-mode: strict
          files:
            - "**/internal/control/**"
            - "**/internal/listen/**"
            - "**/internal/slackevent/**"
            - "!$test"
          allow:
            - errors$
            - fmt$
            - regexp$
            - slices$
            - strings$
            - time$
            - unicode$
            - unicode/utf8$
    forbidigo:
      forbid:
        - pattern: ^os\.(Getenv|LookupEnv|Environ|ExpandEnv)$
          msg: only cmd reads the process environment
  exclusions:
    rules:
      - path: _test\.go
        linters: [dupl, funlen, gocyclo, unparam]
      - path: (_test\.go|^cmd/)
        linters: [forbidigo]
