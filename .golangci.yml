version: "2"
linters:
  enable:
    - depguard
    - dupl
    - funlen
    - gocritic
    - gocyclo
    - nakedret
    - revive
    - unparam
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    funlen:
      lines: 70
      statements: 50
    dupl:
      threshold: 120
    gocyclo:
      min-complexity: 15
    revive:
      rules:
        - name: comment-spacings
          disabled: true
        - name: exported
          disabled: true
    # Imports point down only
    # 1. cmd uses everything and nothing imports cmd
    # 2. relay and workmap use locmap
    # 3. guard uses only dest and shell
    # 4. any package may use fileio and shell which use no package of the module
    depguard:
      rules:
        base:
          files:
            - "**/internal/fileio/**"
            - "**/internal/shell/**"
            - "!$test"
          deny:
            - pkg: github.com/jeon-jihyeon/meetproxy
              desc: fileio and shell use no package of the module
        leaf:
          files:
            - "**/internal/locmap/**"
            - "**/internal/dest/**"
          deny:
            - pkg: github.com/jeon-jihyeon/meetproxy/internal/relay
              desc: locmap and dest do not import relay
            - pkg: github.com/jeon-jihyeon/meetproxy/internal/guard
              desc: locmap and dest do not import guard
            - pkg: github.com/jeon-jihyeon/meetproxy/internal/workmap
              desc: locmap and dest do not import workmap
            - pkg: github.com/jeon-jihyeon/meetproxy/cmd
              desc: nothing imports cmd
        workmap:
          files:
            - "**/internal/workmap/**"
          deny:
            - pkg: github.com/jeon-jihyeon/meetproxy/internal/relay
              desc: workmap does not import relay
            - pkg: github.com/jeon-jihyeon/meetproxy/internal/guard
              desc: workmap does not import guard
            - pkg: github.com/jeon-jihyeon/meetproxy/internal/dest
              desc: workmap does not know about posting
            - pkg: github.com/jeon-jihyeon/meetproxy/cmd
              desc: nothing imports cmd
        guard:
          files:
            - "**/internal/guard/**"
          deny:
            - pkg: github.com/jeon-jihyeon/meetproxy/internal/relay
              desc: guard decides from the locations it is given
            - pkg: github.com/jeon-jihyeon/meetproxy/internal/locmap
              desc: guard uses only dest and shell
            - pkg: github.com/jeon-jihyeon/meetproxy/internal/workmap
              desc: guard uses only dest and shell
            - pkg: github.com/jeon-jihyeon/meetproxy/internal/fileio
              desc: guard uses only dest and shell
            - pkg: github.com/jeon-jihyeon/meetproxy/cmd
              desc: nothing imports cmd
        relay:
          files:
            - "**/internal/relay/**"
          deny:
            - pkg: github.com/jeon-jihyeon/meetproxy/internal/dest
              desc: relay does not know about posting
            - pkg: github.com/jeon-jihyeon/meetproxy/internal/guard
              desc: relay does not know about posting
            - pkg: github.com/jeon-jihyeon/meetproxy/cmd
              desc: nothing imports cmd
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - dupl
          - funlen
          - gocyclo
          - unparam
